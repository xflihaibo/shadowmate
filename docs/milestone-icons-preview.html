<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>伴影 · 里程碑图标预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #333; }
    p { font-size: 13px; color: #666; margin: 0 0 20px; }
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 12px; font-weight: 600; color: #888; margin-bottom: 12px; text-transform: uppercase;
    }
    .header-mock {
      background: linear-gradient(135deg, #ff8c00 0%, #ff0080 100%);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.95);
      padding: 4px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 500;
    }
    .icon-wrap {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap svg {
      width: 100%;
      height: 100%;
      color: rgba(255, 255, 255, 0.95);
    }
    .light-row {
      background: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      border: 1px solid #eee;
    }
    .badge-light {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #333;
      padding: 4px 10px;
      border-radius: 10px;
      background: #fff9f0;
      border: 1px solid rgba(255, 140, 0, 0.2);
      font-size: 11px;
      font-weight: 500;
    }
    .badge-light .icon-wrap svg {
      color: #e67e22;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .grid-item {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #eee;
    }
    .grid-item .icon-wrap {
      width: 32px;
      height: 32px;
      margin: 0 auto 8px;
    }
    .grid-item .label { font-size: 12px; color: #333; font-weight: 600; }
    .grid-item .name { font-size: 11px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>伴影 · 里程碑图标预览</h1>
  <p>在 header 渐变上的效果（白图标）与在浅色背景上的效果（橙图标）。</p>

  <div class="section">
    <div class="section-title">在 header 上（白图标 · 实际效果）</div>
    <div class="header-mock">
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M5.64 5.64l2.83 2.83M15.53 15.53l2.83 2.83M5.64 18.36l2.83-2.83M15.53 8.47l2.83-2.83"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" opacity="0.9"/></svg></span><span>初识</span></span>
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="7" r="1.5"/><circle cx="16.5" cy="9.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/><circle cx="12" cy="17" r="1.5"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="7.5" cy="9.5" r="1.5"/></svg></span><span>相知</span></span>
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4-4-8-10-8-14a8 8 0 0116 0c0 4-4 10-8 14z"/><path d="M12 8v14"/></svg></span><span>相伴</span></span>
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12v8a2 2 0 01-2 2H8a2 2 0 01-2-2V8z"/><path d="M6 10V6c0-1.1.9-2 2-2h2"/><path d="M18 10V6c0-1.1-.9-2-2-2h-2"/><path d="M4 12h16"/></svg></span><span>老友</span></span>
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></span><span>挚友</span></span>
      <span class="badge"><span class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 17 14 18 22 12 18 6 22 7 14 2 9 9 9 12 2"/></svg></span><span>一年之约</span></span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">大图逐个查看</div>
    <div class="grid">
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><path d="M5.64 5.64l2.83 2.83M15.53 15.53l2.83 2.83M5.64 18.36l2.83-2.83M15.53 8.47l2.83-2.83"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" opacity="0.9"/></svg></div>
        <div class="label">初识</div>
        <div class="name">sparkle</div>
      </div>
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="7" r="1.5"/><circle cx="16.5" cy="9.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/><circle cx="12" cy="17" r="1.5"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="7.5" cy="9.5" r="1.5"/></svg></div>
        <div class="label">相知</div>
        <div class="name">flower</div>
      </div>
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4-4-8-10-8-14a8 8 0 0116 0c0 4-4 10-8 14z"/><path d="M12 8v14"/></svg></div>
        <div class="label">相伴</div>
        <div class="name">leaf</div>
      </div>
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12v8a2 2 0 01-2 2H8a2 2 0 01-2-2V8z"/><path d="M6 10V6c0-1.1.9-2 2-2h2"/><path d="M18 10V6c0-1.1-.9-2-2-2h-2"/><path d="M4 12h16"/></svg></div>
        <div class="label">老友</div>
        <div class="name">cup</div>
      </div>
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></div>
        <div class="label">挚友</div>
        <div class="name">heart</div>
      </div>
      <div class="grid-item">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 17 14 18 22 12 18 6 22 7 14 2 9 9 9 12 2"/></svg></div>
        <div class="label">一年之约</div>
        <div class="name">star</div>
      </div>
    </div>
  </div>
</body>
</html>
